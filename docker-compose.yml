version: '3.8'

services:
  identity-verification:
    build: .
    container_name: identity_verification_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FACE_MODEL=buffalo_l
      - FACE_SIMILARITY_THRESHOLD=0.65
      - OCR_LANGUAGE=en
      - CAMERA_INDEX=0
    volumes:
      - ./data:/app/data
      - ~/.insightface:/root/.insightface
      - ~/.paddleocr:/root/.paddleocr
    restart: unless-stopped
